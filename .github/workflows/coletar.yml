name: Coletar lotes

on:
  schedule:
    # a cada 3 horas (horário UTC; equivale a 3h a menos em Brasília)
    - cron: "20 */3 * * *"
  workflow_dispatch:
    inputs:
      fontes:
        description: "Só algumas fontes? (ex.: favareto kuss). Vazio = todas"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rodar robôs
        run: python coletor/rodar.py ${{ github.event.inputs.fontes }}
      - name: Salvar dados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/dados
          git diff --cached --quiet || git commit -m "Atualiza lotes $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X ours || true
          git push
